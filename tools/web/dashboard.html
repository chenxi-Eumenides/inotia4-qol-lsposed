<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>艾诺迪亚4 · 数据仪表盘</title>
<style>
  :root {
    --bg: #f5f6f8;
    --panel: #ffffff;
    --border: #d8dce3;
    --text: #1a202c;
    --dim: #6b7280;
    --accent: #2563eb;
    --head: #f1f3f6;
  }
  body[data-theme="dark"] {
    --bg: #0b0f19;
    --panel: #131a28;
    --border: #25304a;
    --text: #e5e9f0;
    --dim: #8b98b4;
    --accent: #60a5fa;
    --head: #1a2337;
  }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    background: var(--bg);
    color: var(--text);
    font-family: "Fira Sans", "PingFang SC", "Microsoft YaHei", "Noto Sans CJK SC", sans-serif;
    font-size: 14px;
    line-height: 1.5;
    padding: 12px;
  }
  header {
    display: flex;
    align-items: center;
    gap: 16px;
    margin-bottom: 12px;
  }
  header h1 { font-size: 18px; font-weight: 700; }
  header .meta { color: var(--dim); font-family: "Fira Code", monospace; font-size: 12px; }
  .conn { display: flex; align-items: center; gap: 6px; margin-left: auto; font-family: "Fira Code", monospace; font-size: 12px; color: var(--dim); }
  .dot { width: 10px; height: 10px; border-radius: 50%; background: #ef4444; }
  .dot.on { background: #22c55e; }
  #settingsBtn {
    background: var(--panel);
    border: 1px solid var(--border);
    border-radius: 6px;
    color: var(--dim);
    width: 30px; height: 30px;
    display: inline-flex; align-items: center; justify-content: center;
    cursor: pointer;
    margin-left: 8px;
  }
  #settingsBtn:hover { color: var(--accent); border-color: var(--accent); }
  #settingsBtn svg { width: 16px; height: 16px; }
  #viewToggle {
    background: var(--panel);
    border: 1px solid var(--border);
    border-radius: 6px;
    color: var(--dim);
    font-size: 11px;
    font-family: "Fira Code", monospace;
    padding: 5px 10px;
    cursor: pointer;
    margin-left: 8px;
    white-space: nowrap;
  }
  #viewToggle:hover { color: var(--accent); border-color: var(--accent); }
  #viewToggle.active { color: var(--accent); border-color: var(--accent); background: rgba(37, 99, 235, 0.08); }

  /* ===== 专用视图 ===== */
  .sp-stat { display: flex; flex-wrap: wrap; gap: 8px 20px; padding-bottom: 8px; margin-bottom: 8px; border-bottom: 1px solid var(--border); }
  .sp-stat .st { display: flex; align-items: baseline; gap: 6px; }
  .sp-stat .st .lbl { font-size: 11px; color: var(--dim); font-family: "Fira Code", monospace; }
  .sp-stat .st .val { font-size: 13px; font-weight: 700; font-family: "Fira Code", monospace; }
  .sp-cards { display: flex; flex-direction: column; gap: 8px; }
  .sp-card {
    background: var(--head);
    border: 1px solid var(--border);
    border-radius: 8px;
    padding: 8px 10px;
  }
  .sp-card .head { display: flex; align-items: center; gap: 8px; margin-bottom: 6px; }
  .sp-card .head .nm { font-weight: 700; font-size: 13px; }
  .sp-card .head .sub { font-size: 11px; color: var(--dim); font-family: "Fira Code", monospace; }
  .sp-card .head .tag { font-size: 10px; font-weight: 600; padding: 1px 6px; border-radius: 4px; background: var(--panel); border: 1px solid var(--border); color: var(--dim); }
  .sp-card .head .tag.main { color: #fff; background: var(--accent); border-color: var(--accent); }
  .sp-card .head .tag.side { color: #7c3aed; }
  .sp-bars { display: flex; flex-direction: column; gap: 4px; }
  .sp-bar { display: flex; align-items: center; gap: 8px; font-size: 11px; }
  .sp-bar .bt { flex: 0 0 auto; font-family: "Fira Code", monospace; color: var(--dim); }
  .sp-bar .track { flex: 1 1 auto; height: 10px; border-radius: 5px; background: var(--panel); border: 1px solid var(--border); overflow: hidden; position: relative; }
  .sp-bar .fill { display: block; height: 100%; border-radius: 4px; }
  .sp-bar .fill.hp { background: linear-gradient(90deg, #dc2626, #ef4444); }
  .sp-bar .fill.mp { background: linear-gradient(90deg, #2563eb, #3b82f6); }
  .sp-bar .txt { flex: 0 0 auto; font-family: "Fira Code", monospace; }
  .sp-bar .pct { flex: 0 0 40px; text-align: right; font-family: "Fira Code", monospace; color: var(--dim); }
  .sp-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(140px, 1fr)); gap: 6px; }
  .sp-cell {
    background: var(--head);
    border: 1px solid var(--border);
    border-radius: 6px;
    padding: 5px 8px;
    font-size: 12px;
    display: flex; flex-direction: column; gap: 2px;
    min-width: 0;
  }
  .sp-cell .inm { font-weight: 600; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .sp-cell .imeta { font-size: 10px; color: var(--dim); font-family: "Fira Code", monospace; display: flex; justify-content: space-between; gap: 4px; }
  .sp-cell.r0 { border-left: 3px solid #9ca3af; }
  .sp-cell.r1 { border-left: 3px solid #4ade80; }
  .sp-cell.r2 { border-left: 3px solid #60a5fa; }
  .sp-cell.r3 { border-left: 3px solid #facc15; }
  .sp-cell.r4 { border-left: 3px solid #c084fc; }
  .sp-list { display: flex; flex-direction: column; gap: 4px; }
  .sp-row {
    display: flex; align-items: center; gap: 10px;
    padding: 5px 8px; border-radius: 6px;
    background: var(--head); border: 1px solid var(--border);
    font-size: 12px;
  }
  .sp-row .ix { flex: 0 0 auto; font-family: "Fira Code", monospace; color: var(--dim); font-size: 11px; min-width: 24px; }
  .sp-row .nm { font-weight: 600; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .sp-row .mt { margin-left: auto; flex: 0 0 auto; font-family: "Fira Code", monospace; color: var(--dim); font-size: 11px; }
  .sp-empty { color: var(--dim); font-style: italic; font-size: 12px; padding: 4px 2px; }
  .sp-kv { display: grid; grid-template-columns: auto 1fr; gap: 4px 14px; font-size: 12px; }
  .sp-kv .k { color: var(--dim); font-family: "Fira Code", monospace; white-space: nowrap; }
  .sp-kv .v { font-family: "Fira Code", monospace; word-break: break-all; }
  .sp-screen { display: inline-flex; align-items: center; gap: 8px; padding: 5px 12px; border-radius: 6px; font-size: 13px; font-weight: 700; background: var(--head); border: 1px solid var(--border); font-family: "Fira Code", monospace; }
  .sp-screen.ok { color: #16a34a; }
  .sp-screen.ui { color: #b45309; }
  .sp-tags { display: flex; flex-wrap: wrap; gap: 6px; }
  .sp-tag { font-size: 11px; font-family: "Fira Code", monospace; padding: 3px 10px; border-radius: 5px; background: var(--head); border: 1px solid var(--border); color: var(--dim); }
  .sp-section-title { font-size: 11px; color: var(--dim); opacity: 0.7; margin: 8px 0 4px; font-weight: 600; letter-spacing: 0.05em; }
  .sp-slot-bar { display: flex; flex-wrap: wrap; gap: 4px; }
  .sp-slot { width: 26px; height: 26px; border-radius: 5px; border: 1px solid var(--border); background: var(--head); display: inline-flex; align-items: center; justify-content: center; font-size: 10px; color: var(--dim); font-family: "Fira Code", monospace; }
  .sp-slot.has { border-color: var(--accent); color: var(--accent); background: rgba(37, 99, 235, 0.08); font-weight: 700; }

  .cols { display: flex; flex-wrap: wrap; gap: 12px; align-items: flex-start; }
  .col { flex: 1 1 0; display: flex; flex-direction: column; gap: 12px; min-width: 0; }
  .panel-full { flex: 0 0 100%; }   /* 横跨左右两列的面板（快照） */
  .snap-inner { display: flex; gap: 12px; align-items: flex-start; }
  .snap-table { flex: 1 1 55%; min-width: 0; overflow-x: auto; }
  .tiles-patch {
    flex: 1 1 45%; min-width: 0;
    border-left: 1px dashed var(--border);
    padding-left: 12px;
  }
  .panel {
    background: var(--panel);
    border: 1px solid var(--border);
    border-radius: 8px;
    overflow: hidden;
  }
  .panel h2 {
    font-size: 13px;
    font-weight: 700;
    color: var(--dim);
    background: var(--head);
    padding: 7px 10px;
    border-bottom: 1px solid var(--border);
    font-family: "Fira Code", monospace;
    letter-spacing: 0.05em;
    display: flex;
    justify-content: space-between;
    align-items: center;
    cursor: pointer;
    user-select: none;
  }
  .panel h2:hover { color: var(--text); }
  .panel h2 .err { color: #ef4444; font-weight: 600; }
  .panel h2 .url { color: var(--dim); opacity: 0.55; font-size: 11px; font-weight: 400; letter-spacing: 0; margin-left: 8px; }
  .panel h2 .fold { font-weight: 700; margin-left: auto; }
  .panel .body { padding: 6px 10px 10px; overflow-x: auto; }
  .panel .body.hidden { display: none; }

  table { width: auto; min-width: 100%; border-collapse: collapse; font-size: 12px; }
  th, td {
    text-align: left;
    padding: 3px 8px;
    border-bottom: 1px solid var(--border);
    vertical-align: top;
    word-break: break-all;
    white-space: nowrap;
  }
  th { color: var(--dim); font-weight: 600; white-space: nowrap; background: #fafbfc; }
  td.k { color: var(--dim); font-family: "Fira Code", monospace; white-space: nowrap; }
  td.v { font-family: "Fira Code", monospace; }
  tr:last-child td { border-bottom: none; }
  .v-null { color: #9ca3af; font-style: italic; }
  .v-obj { color: var(--accent); }
  .v-arr { color: #7c3aed; }
  .v-num { color: #0f766e; }
  .v-bool { color: #b45309; }

  .modal-backdrop {
    position: fixed; inset: 0;
    background: rgba(15, 23, 42, 0.5);
    display: flex; align-items: center; justify-content: center;
    z-index: 50;
  }
  .modal-backdrop[hidden] { display: none; }
  .modal {
    background: var(--panel);
    border: 1px solid var(--border);
    border-radius: 8px;
    padding: 18px 20px;
    width: min(360px, 92vw);
    display: flex; flex-direction: column; gap: 12px;
  }
  .modal h3 { font-size: 15px; }
  .modal label { display: flex; flex-direction: column; gap: 4px; font-size: 13px; color: var(--dim); }
  .modal input, .modal select {
    border: 1px solid var(--border);
    border-radius: 6px;
    padding: 6px 8px;
    font-size: 14px;
    font-family: "Fira Code", monospace;
    background: var(--panel);
    color: var(--text);
    outline: none;
  }
  .modal input:focus, .modal select:focus { border-color: var(--accent); }
  .modal-actions { display: flex; justify-content: flex-end; gap: 8px; }
  .modal-actions button {
    font-size: 13px; font-weight: 600;
    padding: 6px 16px;
    border-radius: 6px;
    border: 1px solid var(--border);
    cursor: pointer;
  }
  .modal-actions .save { background: var(--accent); border-color: var(--accent); color: #fff; }
  .modal-actions .cancel { background: var(--panel); color: var(--dim); }
  .modal-actions .cancel:hover { color: var(--text); }
</style>
</head>
<body>
<header>
  <h1>艾诺迪亚4 · 数据仪表盘</h1>
  <span class="meta" id="updatedAt">等待数据…</span>
  <div class="conn">
    <span class="dot off" id="connDot"></span>
    <span id="connText">连接中…</span>
    <button id="viewToggle" title="切换显示模式">专用视图</button>
    <button id="settingsBtn" aria-label="设置" title="设置">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <circle cx="12" cy="12" r="3"/>
        <path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 1 1-2.83 2.83l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 1 1-4 0v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 1 1-2.83-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 1 1 0-4h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 1 1 2.83-2.83l.06.06a1.65 1.65 0 0 0 1.82.33H9a1.65 1.65 0 0 0 1-1.51V3a2 2 0 1 1 4 0v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 1 1 2.83 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 1 1 0 4h-.09a1.65 1.65 0 0 0-1.51 1z"/>
      </svg>
    </button>
  </div>
</header>

<main class="cols">
  <div class="col left"></div>
  <div class="col right"></div>
</main>

<div class="modal-backdrop" id="settingsModal" hidden>
  <div class="modal" role="dialog" aria-label="设置">
    <h3>设置</h3>
    <label>更新频率（秒）
      <input type="number" id="setInterval" min="0.5" step="0.5" required>
    </label>
    <label>API 地址（不含 http://）
      <input type="text" id="setHost" placeholder="192.168.1.5" spellcheck="false">
    </label>
    <label>端口
      <input type="number" id="setPort" min="1" max="65535" placeholder="8088">
    </label>
    <label>主题
      <select id="setTheme">
        <option value="light">浅色</option>
        <option value="dark">深色</option>
      </select>
    </label>
    <div class="modal-actions">
      <button class="save" id="settingsSave">保存</button>
      <button class="cancel" id="settingsCancel">取消</button>
    </div>
  </div>
</div>

<script>
"use strict";
/* ========== 配置 ========== */
const DEFAULTS = { api: "http://localhost:8088", interval: 2000, timeout: 5000 };
let apiBase = DEFAULTS.api;
let mockMode = false;
let viewMode = "special"; // special=专用视图, auto=自适应表格（localStorage 持久化）

/* 端点清单：id=面板标题，url=路径，freq=轮询倍率，col=所在栏；dynamic 端点的 url 含 {map_id} 占位 */
const ENDPOINTS = [
  /* 横跨两列 */
  { id: "快照", url: "/api/system/snapshot", freq: 1, col: "full" },
  /* 左栏 */
  { id: "队伍", url: "/api/character/party", freq: 1, col: "left" },
  { id: "佣兵", url: "/api/character/mercenary", freq: 5, col: "left" },
  { id: "任务", url: "/api/quest", freq: 5, col: "left" },
  { id: "背包", url: "/api/item/inventory", freq: 1, col: "left" },
  { id: "商店", url: "/api/item/shop/items", freq: 10, col: "left" },
  { id: "游戏信息", url: "/api/system/info", freq: 10, col: "left" },
  { id: "事件", url: "/api/system/events", freq: 10, col: "left" },
  /* 右栏 */
  { id: "界面", url: "/api/ui", freq: 1, col: "right" },
  { id: "敌人", url: "/api/world/map/enemies", freq: 5, col: "right" },
  { id: "交互对象", url: "/api/world/map/interactives", freq: 5, col: "right" },
  { id: "单位", url: "/api/world/map/units", freq: 5, col: "right" },
  { id: "出口", url: "/api/world/map/exits", freq: 5, col: "right" },
  { id: "配置", url: "/api/config/list", freq: 20, col: "right" },
  { id: "静态表", url: "/api/system/tables", freq: 20, col: "right" },
];

/* ========== 配置解析 ========== */
function normalizeApi(api, port) {
  let s = String(api).trim().replace(/\/+$/, "");
  if (!/^https?:\/\//i.test(s)) s = "http://" + s + ":" + (port || "8088");
  else if (port && !/:\d+(\/|$)/.test(s)) s = s + ":" + port;
  return s;
}

function resolveConfig() {
  const params = new URLSearchParams(location.search);
  const urlApi = params.get("api");
  const urlPort = params.get("port");
  const urlIv = parseFloat(params.get("interval"));
  if (urlApi) {
    apiBase = normalizeApi(urlApi, urlPort);
    localStorage.setItem("api", apiBase);
  } else {
    const saved = localStorage.getItem("api");
    if (saved) apiBase = saved.replace(/\/+$/, "");
  }
  mockMode = params.get("mock") === "1";
  viewMode = localStorage.getItem("viewMode") || "special";
  const theme = params.get("theme") || localStorage.getItem("theme") || "light";
  document.body.dataset.theme = theme;
  const savedIv = parseFloat(localStorage.getItem("interval"));
  if (urlIv > 0) DEFAULTS.interval = Math.round(urlIv * 1000);
  else if (savedIv > 0) DEFAULTS.interval = Math.round(savedIv * 1000);
}

function setConn(state) {
  document.getElementById("connDot").className = "dot " + (state === "on" ? "on" : "off");
  document.getElementById("connText").textContent = state === "on" ? "在线" : (state === "off" ? "离线" : "连接中…");
}

/* ========== 面板构建 ========== */
const panelEls = {};

function collapsedSet() {
  try { return new Set(JSON.parse(localStorage.getItem("collapsed") || "[]")); } catch { return new Set(); }
}
function togglePanel(id) {
  const p = panelEls[id];
  if (!p) return;
  const hidden = p.body.classList.toggle("hidden");
  p.h2.querySelector(".fold").textContent = hidden ? "+" : "−";
  const set = collapsedSet();
  if (hidden) set.add(id); else set.delete(id);
  localStorage.setItem("collapsed", JSON.stringify([...set]));
  /* 展开时立即请求一次，随后照常轮询 */
  if (!hidden && !mockMode) {
    if (id === "快照") {
      refreshTiles(); // 展开快照面板时同步刷新瓦片区
      fetchWithTimeout(apiBase + p.url)
        .then(d => renderPanel(id, d))
        .catch(() => {});
      return;
    }
    p.body.textContent = "…";
    let url = p.url;
    if (p.dynamic) {
      if (lastMapId < 0) { p.body.textContent = "等待地图…"; return; }
      url = url.replace("{map_id}", lastMapId);
    }
    fetchWithTimeout(apiBase + url)
      .then(d => renderPanel(id, d))
      .catch(() => { p.body.textContent = "请求失败"; });
  }
}

/* 切图时立即刷新瓦片（渲染到快照面板内的瓦片区） */
function renderMapTiles() {
  const p = panelEls["快照"];
  if (!p || p.body.classList.contains("hidden") || lastMapId < 0 || mockMode) return;
  fetchWithTimeout(apiBase + "/api/world/maps/" + lastMapId + "/tiles")
    .then(d => { tilesCache = d; renderTilesIntoSnapshot(d); })
    .catch(() => {});
}

/* 周期刷新瓦片（原独立面板 freq=10 语义），渲染到快照面板瓦片区 */
function refreshTiles() {
  if (lastMapId < 0 || mockMode) return;
  const p = panelEls["快照"];
  if (!p || p.body.classList.contains("hidden")) return;
  fetchWithTimeout(apiBase + "/api/world/maps/" + lastMapId + "/tiles")
    .then(d => { tilesCache = d; renderTilesIntoSnapshot(d); })
    .catch(() => {});
}

function buildPanels() {
  document.querySelectorAll(".col").forEach(c => c.textContent = "");
  const hasPref = localStorage.getItem("collapsed") !== null;
  const collapsed = collapsedSet();
  ENDPOINTS.forEach(e => {
    const isCollapsed = hasPref ? collapsed.has(e.id) : true; // 默认全部折叠
    const panel = document.createElement("section");
    panel.className = "panel";
    const h2 = document.createElement("h2");
    h2.textContent = e.id;
    const urlEl = document.createElement("span");
    urlEl.className = "url";
    urlEl.textContent = "(" + e.url + ")";
    h2.appendChild(urlEl);
    const fold = document.createElement("span");
    fold.className = "fold";
    fold.textContent = isCollapsed ? "+" : "−";
    h2.appendChild(fold);
    h2.addEventListener("click", () => togglePanel(e.id));
    const body = document.createElement("div");
    body.className = "body" + (isCollapsed ? " hidden" : "");
    body.textContent = "—";
    panel.appendChild(h2);
    panel.appendChild(body);
    /* 快照面板横跨左右两列（内部再左右分栏），放在列之前；其余面板进各自列 */
    if (e.id === "快照") {
      panel.classList.add("panel-full");
      document.querySelector(".cols").prepend(panel);
    } else {
      document.querySelector(".col." + e.col).appendChild(panel);
    }
    panelEls[e.id] = { body, h2, url: e.url, dynamic: !!e.dynamic };
  });
}

/* ========== 通用 JSON 渲染 ========== */
function esc(s) {
  return String(s).replace(/[&<>"']/g, c => ({
    "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;"
  })[c]);
}

function cellClass(v) {
  if (v === null || v === undefined) return "v-null";
  if (typeof v === "number") return "v-num";
  if (typeof v === "boolean") return "v-bool";
  if (typeof v === "object") return Array.isArray(v) ? "v-arr" : "v-obj";
  return "v";
}

function valText(v) {
  if (v === null || v === undefined) return "null";
  if (typeof v === "object") return Array.isArray(v) ? "[" + v.length + " 项]" : "{…}";
  return String(v);
}

/* 单元格内容：标量→文本；对象/数组→默认展开的可折叠子表格 */
function cellContent(v) {
  if (v === null || v === undefined) return "<span class='v-null'>null</span>";
  if (typeof v === "object") {
    return "<details open><summary>" + esc(valText(v)) + "</summary>" + renderTable(v) + "</details>";
  }
  return esc(String(v));
}

/* 渲染对象/数组为表格：对象→键值对，数组→同构对象表格或列表；嵌套值递归子表格 */
function renderTable(data) {
  let rows = "";
  if (Array.isArray(data)) {
    if (data.length === 0) return "<table><tr><td class='v-null'>空数组</td></tr></table>";
    const isObjArr = data.every(o => o !== null && typeof o === "object" && !Array.isArray(o));
    if (isObjArr) {
      const keys = [...new Set(data.flatMap(o => Object.keys(o)))];
      rows = "<tr>" + keys.map(k => "<th>" + esc(k) + "</th>").join("") + "</tr>";
      data.forEach(o => {
        rows += "<tr>" + keys.map(k => {
          const v = o[k];
          return "<td class='" + cellClass(v) + "'>" + cellContent(v) + "</td>";
        }).join("") + "</tr>";
      });
      return "<table>" + rows + "</table>";
    }
    rows = data.map(v => "<tr><td class='" + cellClass(v) + "'>" + cellContent(v) + "</td></tr>").join("");
    return "<table>" + rows + "</table>";
  }
  Object.entries(data).forEach(([k, v]) => {
    rows += "<tr><td class='k'>" + esc(k) + "</td><td class='" + cellClass(v) + "'>" + cellContent(v) + "</td></tr>";
  });
  return "<table>" + rows + "</table>";
}

function renderPanel(id, json) {
  const panel = panelEls[id];
  if (!panel) return;
  const body = panel.body;
  /* 专用视图：按面板 id 分发到专门的渲染器 */
  if (viewMode === "special" && SPECIAL_VIEWS[id]) {
    SPECIAL_VIEWS[id](body, json);
    return;
  }
  if (id === "快照" && json && typeof json === "object") {
    renderSnapshotPanel(body, json);
    return;
  }
  /* 记录现有嵌套子表格的折叠状态（按 DOM 顺序），重建后恢复 */
  const openStates = Array.from(body.querySelectorAll("details")).map(d => d.open);
  body.textContent = "";
  if (json === null || typeof json !== "object") {
    body.textContent = String(json);
    return;
  }
  body.innerHTML = renderTable(json);
  const newDetails = body.querySelectorAll("details");
  openStates.forEach((open, i) => {
    if (newDetails[i]) newDetails[i].open = open;
  });
}

/* 通用小工具 */
function spEl(tag, cls, text) {
  const el = document.createElement(tag);
  if (cls) el.className = cls;
  if (text !== undefined) el.textContent = text;
  return el;
}
function pct(cur, max) { return max > 0 ? Math.max(0, Math.min(100, (cur / max) * 100)) : 0; }
function rarityCls(item) {
  if (!item) return "";
  const r = item.rarity != null ? item.rarity : item.rarity_tier;
  const map = { 0: "r0", 1: "r1", 2: "r2", 3: "r3", 4: "r4", "白": "r0", "绿": "r1", "蓝": "r2", "黄": "r3", "紫": "r4" };
  return map[r] || "";
}

function fmtN(n) { return (n == null || isNaN(n)) ? "—" : Number(n).toLocaleString("en-US"); }
function barEl(label, cur, max) {

/* ========== 地图瓦片：base64 → 64×64 canvas（出口绿/阻挡深/地面灰度） ========== */
let lastHero = { tx: -1, ty: -1 };   // 主控角色 tile 坐标（由快照 x/y >> 4 更新）
let lastMapId = -1;                  // 当前地图 id（由快照 map_id 更新，瓦片动态端点用）
let tilesMarker = null;              // 主控标记元素（绝对定位覆盖在 canvas 上）
let tilesHeroEl = null;              // 信息行主控坐标文本

function tileColor(v) {
  if (v & 0x80) return "#16a34a";              // 出口（bit7）
  if (v & 0x08) return "#1e293b";              // 阻挡（bit3）
  if (v === 0) return "#d9dce2";               // 普通地面
  const g = Math.min(200, 56 + v * 8);         // 其他类型：递增灰度
  return "rgb(" + g + "," + Math.max(40, g - 8) + "," + g + ")";
}

/* 主控标记移到最新 tile 坐标（只移动 DOM，不重绘 canvas） */
function updateHeroMarker() {
  if (lastHero.tx < 0) return;
  if (tilesMarker) {
    const cell = 8;
    tilesMarker.style.left = (lastHero.tx * cell) + "px";
    tilesMarker.style.top = (lastHero.ty * cell) + "px";
  }
  if (tilesHeroEl) tilesHeroEl.textContent = "主控 " + lastHero.tx + "," + lastHero.ty;
}

function renderTilesPanel(body, json) {
  body.textContent = "";
  const size = json.size || 64;
  const cell = 8;
  let buf; // Uint8Array(size*size)，行优先
  if (Array.isArray(json.tiles)) {
    /* encoding=array：双层数组 tiles[y][x] */
    buf = new Uint8Array(size * size);
    for (let y = 0; y < size; y++) {
      const row = json.tiles[y];
      if (!Array.isArray(row)) continue;
      for (let x = 0; x < size; x++) {
        buf[y * size + x] = row[x] || 0;
      }
    }
  } else if (typeof json.tiles === "string") {
    /* 兼容旧格式：base64 单层字节 */
    try {
      const raw = atob(json.tiles);
      buf = new Uint8Array(raw.length);
      for (let i = 0; i < raw.length; i++) buf[i] = raw.charCodeAt(i);
    } catch (e) {
      body.textContent = "tiles 解码失败：" + e.message;
      return;
    }
  } else {
    body.textContent = "tiles 数据格式异常";
    return;
  }
  const wrap = document.createElement("div");
  wrap.style.cssText = "position:relative;display:inline-block;max-width:100%;";
  const canvas = document.createElement("canvas");
  canvas.width = size * cell;
  canvas.height = size * cell;
  canvas.style.width = "100%";
  canvas.style.height = "auto";
  canvas.style.maxWidth = size * cell + "px";
  const ctx = canvas.getContext("2d");
  for (let y = 0; y < size; y++) {
    for (let x = 0; x < size; x++) {
      ctx.fillStyle = tileColor(buf[y * size + x]);
      ctx.fillRect(x * cell, y * cell, cell, cell);
    }
  }
  wrap.appendChild(canvas);
  /* 主控角色标记：红色方块 + 白色中心点，按 tile 定位 */
  const marker = document.createElement("div");
  marker.style.cssText = "position:absolute;left:0;top:0;width:" + cell + "px;height:" + cell + "px;"
    + "background:#ef4444;border:1px solid #fff;box-sizing:border-box;"
    + "display:flex;align-items:center;justify-content:center;pointer-events:none;z-index:2;"
    + "box-shadow:0 0 4px rgba(239,68,68,.9);";
  marker.innerHTML = "<span style='width:3px;height:3px;background:#fff;border-radius:50%;'></span>";
  wrap.appendChild(marker);
  tilesMarker = marker;
  body.appendChild(wrap);
  updateHeroMarker();

  const info = document.createElement("div");
  info.style.cssText = "margin-top:6px;font-family:'Fira Code',monospace;font-size:12px;color:var(--dim);";
  info.textContent = "map_id " + json.map_id + " · " + size + "×" + size + " · src " + json.src + " · ";
  const heroSpan = document.createElement("span");
  heroSpan.textContent = "主控 " + lastHero.tx + "," + lastHero.ty;
  info.appendChild(heroSpan);
  tilesHeroEl = heroSpan;
  body.appendChild(info);

  const legend = document.createElement("div");
  legend.style.cssText = "margin-top:6px;display:flex;gap:12px;font-size:12px;color:var(--dim);flex-wrap:wrap;";
  const item = (color, label) => {
    const s = document.createElement("span");
    s.style.cssText = "display:inline-flex;align-items:center;gap:4px;";
    s.innerHTML = "<span style='display:inline-block;width:10px;height:10px;background:" + color + ";border:1px solid var(--border);'></span>" + label;
    return s;
  };
  legend.appendChild(item("#16a34a", "出口"));
  legend.appendChild(item("#1e293b", "阻挡"));
  legend.appendChild(item("#d9dce2", "地面"));
  legend.appendChild(item("#a8b2c0", "其他"));
  legend.appendChild(item("#ef4444", "主控"));
  body.appendChild(legend);
}

/* ========== 数据获取 ========== */
let tick = 0;

async function fetchWithTimeout(url) {
  const ctrl = new AbortController();
  const timer = setTimeout(() => ctrl.abort(), DEFAULTS.timeout);
  try {
    const res = await fetch(url, { signal: ctrl.signal, cache: "no-store" });
    if (!res.ok) throw new Error("HTTP " + res.status);
    const text = await res.text();
    let data;
    try { data = JSON.parse(text); } catch { data = text; }
    return data;
  } finally {
    clearTimeout(timer);
  }
}

async function refreshAll() {
  tick++;
  const results = await Promise.allSettled(ENDPOINTS.map(e => {
    const p = panelEls[e.id];
    /* 折叠面板跳过请求（瓦片已嵌入快照面板，不再需要快照常驻拉取） */
    if (p && p.body.classList.contains("hidden")) return Promise.resolve(null);
    if (tick % e.freq !== 0) return Promise.resolve(null);
    if (e.dynamic) {
      if (lastMapId < 0) return Promise.resolve(null); // 尚无 map_id 不请求
      return fetchWithTimeout(apiBase + e.url.replace("{map_id}", lastMapId));
    }
    return fetchWithTimeout(apiBase + e.url);
  }));
  let anyOk = false;
  results.forEach((r, i) => {
    const e = ENDPOINTS[i];
    const p = panelEls[e.id];
    if (!p) return;
    const errEl = p.h2.querySelector(".err");
    if (r.status === "fulfilled" && r.value !== null) {
      renderPanel(e.id, r.value);
      anyOk = true;
      if (errEl) errEl.remove();
      /* 快照中的主控坐标 → tile 坐标，实时移动地图标记；缓存 map_id 供瓦片动态端点 */
      if (e.url === "/api/system/snapshot" && typeof r.value.x === "number" && typeof r.value.y === "number") {
        lastHero = { tx: r.value.x >> 4, ty: r.value.y >> 4 };
        updateHeroMarker();
      }
      if (e.url === "/api/system/snapshot" && typeof r.value.map_id === "number") {
        const prev = lastMapId;
        const id = r.value.map_id;
        /* 主菜单/无效地图：map_id 为 -1 或 4294967295（无符号溢出）等异常值，不触发瓦片 */
        lastMapId = (id >= 0 && id <= 100000) ? id : -1;
        if (prev !== lastMapId) renderMapTiles(); // 切图时立即刷新瓦片
        else if (tick % 10 === 0) refreshTiles();  // 周期刷新（原瓦片面板 freq=10）
      }
    } else if (r.status === "rejected" && !errEl) {
      p.h2.insertAdjacentHTML("beforeend", "<span class='err'> ✗</span>");
    }
  });
  document.getElementById("updatedAt").textContent = new Date().toLocaleTimeString("zh-CN");
  checkHealth(); // 在线/离线由独立 health 探测决定（不受面板折叠影响）
}

/* 独立健康探测：决定右上角在线/离线状态 */
async function checkHealth() {
  if (mockMode) { setConn("on"); return; }
  try {
    await fetchWithTimeout(apiBase + "/api/health");
    setConn("on");
  } catch (e) {
    setConn("off");
  }
}

function poll() {
  if (!mockMode) refreshAll();
  setTimeout(poll, DEFAULTS.interval);
}

/* ========== 设置弹窗 ========== */
const settingsModal = document.getElementById("settingsModal");
const setIntervalEl = document.getElementById("setInterval");
const setHostEl = document.getElementById("setHost");
const setPortEl = document.getElementById("setPort");
const setThemeEl = document.getElementById("setTheme");

function parseApiBase(url) {
  const m = /^https?:\/\/([^/:]+)(?::(\d+))?/.exec(String(url).trim());
  return m ? { host: m[1], port: m[2] || "8088" } : null;
}

function openSettings() {
  const parsed = parseApiBase(apiBase);
  setHostEl.value = parsed ? parsed.host : "";
  setPortEl.value = parsed ? parsed.port : "";
  setIntervalEl.value = String(DEFAULTS.interval / 1000).replace(/\.0$/, "");
  setThemeEl.value = document.body.dataset.theme || "light";
  settingsModal.hidden = false;
  setHostEl.focus();
}

function saveSettings() {
  const host = setHostEl.value.trim().replace(/^https?:\/\//, "").replace(/\/+$/, "");
  const port = setPortEl.value.trim();
  const sec = parseFloat(setIntervalEl.value);
  if (!host) { setHostEl.focus(); return; }
  if (!/^\d{1,5}$/.test(port) || +port < 1 || +port > 65535) { setPortEl.focus(); return; }
  if (!(sec > 0)) { setIntervalEl.focus(); return; }
  apiBase = "http://" + host + ":" + port;
  localStorage.setItem("api", apiBase);
  localStorage.setItem("interval", String(sec));
  localStorage.setItem("theme", setThemeEl.value);
  settingsModal.hidden = true;
  location.reload();
}

document.getElementById("settingsBtn").addEventListener("click", openSettings);
document.getElementById("settingsSave").addEventListener("click", saveSettings);
document.getElementById("settingsCancel").addEventListener("click", () => { settingsModal.hidden = true; });
settingsModal.addEventListener("click", e => { if (e.target === settingsModal) settingsModal.hidden = true; });
document.addEventListener("keydown", e => { if (e.key === "Escape") settingsModal.hidden = true; });

function switchView() {
  viewMode = viewMode === "special" ? "auto" : "special";

  const collapsedBefore = collapsedSet();

  collapsedBefore.forEach(id => {

    if (p && !p.body.classList.contains("hidden")) {
      p.body.classList.add("hidden");
      p.h2.querySelector(".fold").textContent = "+";
    }
  });
  if (mockMode) startMock();
  else refreshAll();
}

/* mock 瓦片图案：地面渐变 + 回字形阻挡墙 + 门上出口（新格式：双层数组） */
function mockTilesObj() {
  const size = 64;
  const rows = [];
  for (let y = 0; y < size; y++) {
    const row = [];
    for (let x = 0; x < size; x++) {
      let v = (x * 7 + y * 13) % 6;
      const inWall = (x >= 20 && x < 44 && (y === 20 || y === 43)) || (y >= 20 && y < 44 && (x === 20 || x === 43));
      if (inWall) v = 0x08;
      if (x === 32 && y === 20) v = 0x80;
      row.push(v);
    }
    rows.push(row);
  }
  return { map_id: 30, src: "static", width: 64, height: 64, size, encoding: "array", tiles: rows };
}
